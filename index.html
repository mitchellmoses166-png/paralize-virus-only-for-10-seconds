<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate Virus Prank</title>

<style>
body {
    background: black;
    color: red;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
}

h1 {
    font-size: 38px;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: 0.3; }
}

.box {
    border: 3px solid red;
    padding: 25px;
    max-width: 600px;
    margin: auto;
    box-shadow: 0 0 25px red;
}

.progress {
    width: 100%;
    background: #333;
    height: 25px;
    margin-top: 20px;
}

.bar {
    width: 0%;
    height: 25px;
    background: red;
    transition: width 0.3s;
}

button {
    padding: 15px 30px;
    background: red;
    color: white;
    border: none;
    font-size: 18px;
    cursor: pointer;
    margin-top: 25px;
}

#message {
    margin-top: 25px;
    font-size: 20px;
}

#result {
    color: lime;
    font-size: 35px;
    display: none;
}
</style>
</head>

<body>

<div class="box">

<h1>⚠️ VIRUS DETECTED ⚠️</h1>

<h2>FAKE SYSTEM SCANNER</h2>

<p id="status">Preparing harmless prank simulation...</p>

<div class="progress">
    <div class="bar" id="bar"></div>
</div>

<h2 id="percentage">0%</h2>

<p id="message">Please wait...</p>

<button onclick="stopPrank()">STOP PRANK</button>

<h2 id="result">😂 JUST A PRANK!</h2>

</div>

<script>

let progress = 0;
let running = true;

let messages = [
    "Scanning your computer...",
    "Checking imaginary files...",
    "Detecting imaginary threats...",
    "Almost finished...",
    "Finalizing prank..."
];

let timer = setInterval(function() {

    if (!running) return;

    progress += 2;

    document.getElementById("bar").style.width =
        progress + "%";

    document.getElementById("percentage").innerText =
        progress + "%";

    document.getElementById("status").innerText =
        messages[Math.min(
            Math.floor(progress / 20),
            messages.length - 1
        )];

    if (progress >= 100) {

        clearInterval(timer);

        document.getElementById("status").innerText =
            "Simulation completed!";

        document.getElementById("message").innerText =
            "Your computer is perfectly safe.";

    }

}, 300);

function stopPrank() {

    running = false;

    clearInterval(timer);

    document.getElementById("status").innerText =
        "PRANK TERMINATED!";

    document.getElementById("message").innerText =
        "No files were changed. Everything is safe.";

    document.getElementById("result").style.display =
        "block";

    document.getElementById("bar").style.background =
        "lime";

    document.getElementById("bar").style.width =
        "100%";

}

</script>

</body>
</html>
